server:
  port: 5050

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/x_iam?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  security:
    oauth2:
      # 1. OAuth2 Client
      # Login through Keycloak and obtain tokens.
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: x-iam
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/my-company

      # 2. OAuth2 Resource Server
      # Validate JWT access tokens on REST APIs.
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/my-company
          audiences:
            - x-iam-api